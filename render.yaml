databases:
  - name: valhalla-db
    plan: free

envVarGroups:
  - name: valhalla-shared
    envVars:
      - key: SERVICE_TOKEN
        generateValue: true

services:
  # ── Backend Microservices ──
  # Each service builds from its own subdirectory and gets its own public URL.

  - type: web
    name: valhalla-auth
    env: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-menu
    env: docker
    dockerfilePath: ./menu-service/Dockerfile
    dockerContext: ./menu-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-order
    env: docker
    dockerfilePath: ./order-service/Dockerfile
    dockerContext: ./order-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - key: RABBITMQ_HOST
        value: "disabled"
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-inventory
    env: docker
    dockerfilePath: ./inventory-service/Dockerfile
    dockerContext: ./inventory-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-payment
    env: docker
    dockerfilePath: ./payment-service/Dockerfile
    dockerContext: ./payment-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-analytics
    env: docker
    dockerfilePath: ./analytics-service/Dockerfile
    dockerContext: ./analytics-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - key: RABBITMQ_HOST
        value: "disabled"
      - fromGroup: valhalla-shared

  # ── Frontend (Next.js) ──
  # The frontend proxies API calls to each backend service via Next.js rewrites.
  # After deploying, set the *_SERVICE_URL env vars to the actual Render URLs.
  - type: web
    name: valhalla-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - fromGroup: valhalla-shared
      - key: AUTH_SERVICE_URL
        value: https://valhalla-auth.onrender.com
      - key: MENU_SERVICE_URL
        value: https://valhalla-menu.onrender.com
      - key: ORDER_SERVICE_URL
        value: https://valhalla-order.onrender.com
      - key: INVENTORY_SERVICE_URL
        value: https://valhalla-inventory.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://valhalla-payment.onrender.com
      - key: ANALYTICS_SERVICE_URL
        value: https://valhalla-analytics.onrender.com
