databases:
  - name: valhalla-db
    plan: free

envVarGroups:
  - name: valhalla-shared
    envVars:
      - key: SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: valhalla-auth
    env: docker
    dockerfilePath: ./auth-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-menu
    env: docker
    dockerfilePath: ./menu-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-order
    env: docker
    dockerfilePath: ./order-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - key: RABBITMQ_HOST
        value: "disabled"
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-inventory
    env: docker
    dockerfilePath: ./inventory-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-payment
    env: docker
    dockerfilePath: ./payment-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-analytics
    env: docker
    dockerfilePath: ./analytics-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - key: RABBITMQ_HOST
        value: "disabled"
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - fromGroup: valhalla-shared
      - key: AUTH_SERVICE_URL
        value: https://valhalla-auth.onrender.com
      - key: MENU_SERVICE_URL
        value: https://valhalla-menu.onrender.com
      - key: ORDER_SERVICE_URL
        value: https://valhalla-order.onrender.com
      - key: INVENTORY_SERVICE_URL
        value: https://valhalla-inventory.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://valhalla-payment.onrender.com
      - key: ANALYTICS_SERVICE_URL
        value: https://valhalla-analytics.onrender.com
