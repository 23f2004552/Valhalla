databases:
  - name: valhalla-db
    plan: free

envVarGroups:
  - name: valhalla-shared
    envVars:
      - key: SERVICE_TOKEN
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://valhalla-suite.onrender.com
      - key: RABBITMQ_HOST
        value: "replace-with-your-cloudamqp-hostname"
      - key: REDIS_HOST
        value: valhalla-redis

services:
  # 1. Redis Cache
  - type: redis
    name: valhalla-redis
    plan: free
    ipAllowList: []

  # 2. Microservices
  - type: web
    name: valhalla-auth
    env: docker
    dockerContext: .
    dockerfilePath: auth-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-menu
    env: docker
    dockerContext: .
    dockerfilePath: menu-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-order
    env: docker
    dockerContext: .
    dockerfilePath: order-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-inventory
    env: docker
    dockerContext: .
    dockerfilePath: inventory-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-payment
    env: docker
    dockerContext: .
    dockerfilePath: payment-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  - type: web
    name: valhalla-analytics
    env: docker
    dockerContext: .
    dockerfilePath: analytics-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valhalla-db
          property: connectionString
      - fromGroup: valhalla-shared

  # 3. API Gateway (Nginx)
  - type: web
    name: valhalla-gateway
    env: docker
    dockerContext: .
    dockerfilePath: gateway/Dockerfile
    plan: free
    envVars:
      - fromGroup: valhalla-shared

  # 4. Frontend (Next.js)
  - type: web
    name: valhalla-frontend
    env: docker
    dockerContext: .
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - fromGroup: valhalla-shared
      - key: NEXT_PUBLIC_API_URL
        value: https://valhalla-gateway.onrender.com/api # Predictable URL
