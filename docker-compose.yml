version: "3.8"

services:
  # API Gateway (Nginx)
  frontend:
    build: ./frontend
    container_name: rms-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: rms-auth
    expose:
      - "5000"
    ports:
      - "5001:5000"
    restart: unless-stopped
    volumes:
      - ./scripts:/app/scripts
    command: sh -c "python /app/scripts/wait_for_db.py && uvicorn main:app --host 0.0.0.0 --port 5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: authdb
      DB_USER: postgres
      DB_PASSWORD: password

  # Menu Service
  menu-service:
    build: ./menu-service
    container_name: rms-menu
    expose:
      - "5000"
    ports:
      - "5002:5000"
    restart: unless-stopped
    volumes:
      - ./scripts:/app/scripts
    command: sh -c "python /app/scripts/wait_for_db.py && uvicorn main:app --host 0.0.0.0 --port 5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:5000/'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      DB_HOST: db
      DB_NAME: menudb
      DB_USER: postgres
      DB_PASSWORD: password

  # Database (internal only — no host port exposure)
  db:
    image: postgres:15
    container_name: rms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/platform_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
