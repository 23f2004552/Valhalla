global:
  scrape_interval: 10s

rule_files:
  - "/etc/prometheus/prometheus_rules.yml"

scrape_configs:
  - job_name: 'restaurant-system'
    scheme: https
    static_configs:
      - targets:
        - 'valhalla-order.onrender.com'
        - 'valhalla-inventory.onrender.com'
        - 'valhalla-menu.onrender.com'
        - 'valhalla-payment.onrender.com'
        - 'valhalla-auth.onrender.com'
        - 'valhalla-analytics.onrender.com'
