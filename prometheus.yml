global:
  scrape_interval: 10s

rule_files:
  - "/etc/prometheus/prometheus_rules.yml"

scrape_configs:
  - job_name: 'restaurant-system'
    static_configs:
      - targets:
        - 'rms-order:5000'
        - 'rms-inventory:5000'
        - 'rms-menu:5000'
        - 'rms-payment:5000'
        - 'rms-auth:5000'
        - 'rms-analytics:5000'
