worker_processes auto;
events { worker_connections 1024; }
http {
    upstream auth_upstream      { server valhalla-auth:5000; }
    upstream menu_upstream      { server valhalla-menu:5000; }
    upstream order_upstream     { server valhalla-order:5000; }
    upstream inventory_upstream { server valhalla-inventory:5000; }
    upstream payment_upstream   { server valhalla-payment:5000; }
    upstream analytics_upstream { server valhalla-analytics:5000; }

    server {
        listen 80;
        
        location /api/auth/      { proxy_pass http://auth_upstream/; }
        location /api/menu       { proxy_pass http://menu_upstream/menu; }
        location /api/categories { proxy_pass http://menu_upstream/categories; }
        location /api/orders     { proxy_pass http://order_upstream/orders; }
        location /api/inventory  { proxy_pass http://inventory_upstream/inventory; }
        location /api/payments   { proxy_pass http://payment_upstream/payments; }
        location /api/analytics/ { proxy_pass http://analytics_upstream/; }

        # Health check for Render
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
